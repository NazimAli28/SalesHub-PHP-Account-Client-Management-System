name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, zip, pdo_sqlite, pdo_mysql, sodium
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: composer lint

      - name: Static analysis (Larastan)
        run: composer analyse

      - name: Tests (Pest)
        run: php artisan test

      - name: Dependency audit
        run: composer audit

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, zip, pdo_sqlite, sodium
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Playwright starts the API (SQLite file, seeded) and the Vite server itself.
      - name: Run end-to-end and accessibility tests
        working-directory: frontend
        run: npm run e2e
        env:
          CI: 'true'
          PHP_BINARY: php

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    name: Docker image (build and smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image (not pushed)
        run: docker build -t saleshub:ci --build-arg VITE_DEMO_MODE=true .

      - name: Start the container
        run: |
          docker run -d --name saleshub -p 8080:8080 \
            -e APP_URL=http://localhost:8080 \
            -e SANCTUM_STATEFUL_DOMAINS=localhost:8080 \
            -e FRONTEND_URL=http://localhost:8080 \
            -e SESSION_SECURE_COOKIE=false \
            -e DEMO_MODE=true \
            saleshub:ci

      - name: Smoke test
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/up > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/up > /dev/null
          curl -fsS http://localhost:8080/ | grep -qi '<div id="root">'
          curl -fsS http://localhost:8080/leads | grep -qi '<div id="root">'
          status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: application/json' http://localhost:8080/api/auth/me)
          test "$status" = "401"

      - name: Container logs
        if: failure()
        run: docker logs saleshub

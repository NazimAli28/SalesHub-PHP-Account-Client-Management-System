<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SalesHub: sales operations for digital-services teams." />
    <meta name="color-scheme" content="light dark" />
    <title>SalesHub</title>
    <!--
      Applies the saved theme before the first paint so dark-mode users never see a white flash.
      Keep the storage key and logic in sync with src/app/theme/theme.ts.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('saleshub-theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
